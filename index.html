<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jay's Feed</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Version 2 (25 October 2026, Jay's feedback): a clean top, the tabs at the bottom like any phone app, short cards
   with the detail one tap away, a separate conversation for each card, and real visuals (progress, timelines, bars,
   photos) as well as the first-light backgrounds he loves. */
:root {
  color-scheme: dark;
  --night: #0a1117; --panel: #131e27; --panel2: #1a2833; --ink: #eef3f6; --soft: #a9bac5; --faint: #6f8391; --line: #ffffff1a;
  --glow: #f08aa8; --glacier: #6cc3d4; --gold: #f1b34a; --leaf: #7fd3a0;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --serif: "Fraunces", Georgia, serif;
  --gut: 22px;
  --top: calc(env(safe-area-inset-top, 0px) + 54px);
  --nav: calc(env(safe-area-inset-bottom, 0px) + 62px);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--night); overflow: hidden; overscroll-behavior: none; }
body { color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
a { color: var(--glacier); }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.app { position: fixed; inset: 0; height: 100dvh; max-width: 480px; margin: 0 auto; background: var(--night); overflow: hidden; }

/* ---- top: just the name and what is new, floating over the card ---- */
.top { position: absolute; z-index: 6; left: 0; right: 0; top: 0; height: var(--top); padding: env(safe-area-inset-top, 0px) var(--gut) 0; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(180deg, #0a1117e6 0%, #0a111799 60%, #0a111700 100%); pointer-events: none; }
.top > * { pointer-events: auto; }
.mark { display: flex; align-items: baseline; gap: 8px; }
.mark b { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 1.6rem; letter-spacing: -0.01em; line-height: 1; }
.mark b i { color: var(--glow); font-style: normal; }
.mark span { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--soft); }
.topright { display: flex; align-items: center; gap: 8px; }
.pill { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 999px; background: #ffffff14; color: var(--soft); }
.pill.has { background: var(--gold); color: var(--night); }
.round { width: 36px; height: 36px; border-radius: 50%; border: 0; background: #ffffff12; color: var(--soft); display: grid; place-items: center; cursor: pointer; }
.round.spin svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- the feed ---- */
.feed { position: absolute; left: 0; right: 0; top: 0; bottom: var(--nav); overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
.feed::-webkit-scrollbar { display: none; }
.feed.list { scroll-snap-type: none; }

.card { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.art { position: absolute; inset: 0; }
.art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.card.hasvis .art:not(.photo) { opacity: 0.55; }
.art.photo { background-size: cover; background-position: center; }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, #0a111700 0%, #0a111726 30%, #0a1117cc 62%, #0a1117 92%); }
.content { position: relative; z-index: 2; padding: 0 var(--gut) 18px; display: grid; gap: 12px; min-width: 0; max-width: 100%; }
.content > * { min-width: 0; }
.who { display: flex; gap: 8px; align-items: center; justify-self: start; max-width: 100%; padding: 4px 12px 4px 4px; border-radius: 999px; background: #0a1117a6; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); }
.dot { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 0.7rem; color: var(--night); }
.new { margin-left: 4px; font-size: 0.62rem; letter-spacing: 0.1em; color: var(--night); background: var(--gold); border-radius: 999px; padding: 2px 8px; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(3rem, 17vw, 5rem); line-height: 0.95; letter-spacing: -0.03em; }
.title { font-family: var(--display); font-weight: 800; font-size: 1.5rem; line-height: 1.14; text-wrap: balance; margin: 0; overflow-wrap: anywhere; }
.body { color: #dfe8ee; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; white-space: pre-line; }
.latest { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; border: 0; background: #6cc3d41f; border-left: 3px solid var(--glacier); border-radius: 4px 12px 12px 4px; padding: 8px 12px; cursor: pointer; font-size: 0.9rem; color: #d6eef3; }
.latest span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.latest b { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--glacier); white-space: nowrap; padding-top: 3px; }

.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font-size: 0.92rem; min-height: 42px; padding: 9px 16px; border-radius: 999px; border: 1px solid #ffffff33; background: #0a111766; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.btn.primary { background: var(--ink); color: var(--night); border-color: var(--ink); font-weight: 700; }
.btn[aria-pressed="true"] { background: var(--glacier); color: var(--night); border-color: var(--glacier); font-weight: 700; }
.foot { display: flex; align-items: center; gap: 8px; padding-top: 2px; }
.chip { border: 0; background: #ffffff14; color: var(--ink); border-radius: 999px; min-height: 38px; padding: 0 13px; display: inline-flex; align-items: center; gap: 7px; font-size: 0.85rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--glow); color: var(--night); }
.chip[aria-pressed="true"] svg { fill: currentColor; }
.chip .n { font-family: var(--mono); font-size: 0.7rem; }
.chip .ping { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.pos { margin-left: auto; font-family: var(--mono); font-size: 0.66rem; color: var(--faint); }
.status { font-family: var(--mono); font-size: 0.72rem; color: var(--leaf); }
.status:empty { display: none; }
.status.warn { color: var(--gold); }

/* ---- visuals a card can carry ---- */
.vis { background: #0a11178c; border: 1px solid var(--line); border-radius: 16px; padding: 14px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.ring { display: flex; align-items: center; gap: 16px; }
.ring svg { width: 84px; height: 84px; flex: none; transform: rotate(-90deg); }
.ring .lab { display: grid; gap: 2px; }
.ring .lab b { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1; }
.ring .lab span { color: var(--soft); font-size: 0.88rem; }
.tl { display: grid; gap: 0; }
.tl div { display: grid; grid-template-columns: 52px 14px 1fr; gap: 10px; align-items: center; min-height: 32px; }
.tl time { font-family: var(--mono); font-size: 0.8rem; color: var(--soft); text-align: right; }
.tl i { width: 10px; height: 10px; border-radius: 50%; background: var(--glacier); justify-self: center; position: relative; }
.tl div:not(:last-child) i::after { content: ""; position: absolute; left: 4px; top: 12px; width: 2px; height: 22px; background: #6cc3d455; }
.tl div.now i { background: var(--gold); box-shadow: 0 0 0 4px #f1b34a33; }
.tl span { font-size: 0.92rem; overflow-wrap: anywhere; }
.bars { display: grid; gap: 9px; }
.bars div { display: grid; gap: 4px; }
.bars .l { display: flex; justify-content: space-between; gap: 10px; font-size: 0.85rem; }
.bars .l span:last-child { font-family: var(--mono); color: var(--soft); white-space: nowrap; }
.bars .t { height: 8px; border-radius: 99px; background: #ffffff14; overflow: hidden; }
.bars .t i { display: block; height: 100%; border-radius: 99px; }

/* ---- bottom tabs ---- */
nav { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; height: var(--nav); padding-bottom: env(safe-area-inset-bottom, 0px); display: grid; grid-template-columns: repeat(3, 1fr); background: #0a1117f2; border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
nav button { border: 0; background: transparent; color: var(--faint); display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 0.7rem; letter-spacing: 0.02em; cursor: pointer; position: relative; }
nav button[aria-selected="true"] { color: var(--ink); }
nav button[aria-selected="true"] svg { stroke: var(--glow); }
nav .badge { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 99px; background: var(--gold); color: var(--night); font-family: var(--mono); font-size: 0.62rem; display: grid; place-items: center; }
nav .badge:empty { display: none; }

/* ---- the sheet: dive in, and each card's conversation ---- */
.scrim { position: fixed; inset: 0; z-index: 9; background: #000a; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; max-height: 90dvh; display: flex; flex-direction: column; background: var(--panel); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line); transform: translateY(105%); transition: transform 0.26s cubic-bezier(.2,.8,.2,1); }
.sheet.on { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: #ffffff33; margin: 9px auto 2px; flex: none; }
.sheet .head { display: flex; align-items: flex-start; gap: 12px; padding: 8px var(--gut) 12px; border-bottom: 1px solid var(--line); flex: none; }
.sheet .head h3 { margin: 0; flex: 1; font-family: var(--display); font-weight: 800; font-size: 1.15rem; line-height: 1.2; overflow-wrap: anywhere; }
.sheet .head small { display: block; font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); margin-bottom: 4px; }
.sheet .scroll { overflow-y: auto; padding: 16px var(--gut); display: grid; gap: 14px; align-content: start; overscroll-behavior: contain; }
.sheet .scroll > * { min-width: 0; }
.prose { white-space: pre-line; overflow-wrap: anywhere; font-size: 0.97rem; color: #dfe8ee; }
.prose.dim { color: var(--soft); }
.copybox { background: var(--panel2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; }
.copybox .txt { white-space: pre-line; font-size: 0.95rem; user-select: text; -webkit-user-select: text; overflow-wrap: anywhere; }
.links { display: grid; gap: 8px; }
.links a { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel2); border-radius: 12px; padding: 12px 14px; text-decoration: none; color: var(--ink); overflow-wrap: anywhere; }
.chat { display: grid; gap: 10px; }
.msg { max-width: 84%; padding: 9px 13px; border-radius: 18px; white-space: pre-line; overflow-wrap: anywhere; font-size: 0.95rem; }
.msg.jay { justify-self: end; background: var(--glacier); color: var(--night); border-bottom-right-radius: 6px; }
.msg.team { justify-self: start; background: var(--panel2); border-bottom-left-radius: 6px; }
.msg time { display: block; font-family: var(--mono); font-size: 0.6rem; opacity: 0.65; margin-top: 3px; }
.msg.team b { display: block; font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--glacier); }
.sys { justify-self: center; font-family: var(--mono); font-size: 0.66rem; color: var(--faint); text-align: center; }
.compose { flex: none; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; padding: 10px var(--gut) calc(env(safe-area-inset-bottom, 0px) + 12px); border-top: 1px solid var(--line); background: var(--panel); }
textarea, input[type="search"] { font: inherit; font-size: 1rem; width: 100%; border-radius: 20px; border: 1px solid #ffffff2e; background: var(--night); color: var(--ink); padding: 10px 14px; }
.compose textarea { min-height: 44px; max-height: 130px; resize: none; }
.send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--glow); color: var(--night); display: grid; place-items: center; cursor: pointer; }
.send:disabled { opacity: 0.4; }

/* ---- lists: answered, tell us ---- */
.page { min-height: 100%; padding: calc(var(--top) + 6px) var(--gut) 30px; display: grid; gap: 12px; align-content: start; }
.page h2 { font-family: var(--display); font-weight: 800; font-size: 1.7rem; line-height: 1.15; margin: 4px 0 0; text-wrap: balance; }
.page p { color: var(--soft); margin: 0; }
.item { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 12px 14px; display: grid; gap: 5px; cursor: pointer; color: var(--ink); }
.item .t { font-family: var(--display); font-weight: 700; font-size: 1.02rem; overflow-wrap: anywhere; }
.item .meta { font-family: var(--mono); font-size: 0.66rem; color: var(--soft); display: flex; gap: 10px; flex-wrap: wrap; }
.item .ans { color: var(--glacier); }
.newdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-right: 6px; vertical-align: middle; }
mark { background: var(--gold); color: var(--night); border-radius: 3px; padding: 0 2px; }
.tellbox textarea { min-height: 150px; border-radius: 16px; background: var(--panel); }
.sent { display: grid; gap: 8px; }
.sent div { background: var(--panel); border-radius: 12px; padding: 10px 12px; font-size: 0.9rem; color: var(--soft); overflow-wrap: anywhere; }
.sent time { display: block; font-family: var(--mono); font-size: 0.6rem; color: var(--faint); }
.empty { height: 100%; scroll-snap-align: start; display: grid; align-content: center; gap: 12px; padding: var(--top) var(--gut) 30px; }
.empty h2 { font-family: var(--display); font-weight: 800; font-size: 1.8rem; margin: 0; text-wrap: balance; }
.empty p { color: var(--soft); margin: 0; }
.install { border: 1px dashed #ffffff33; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim { transition: none; } .round.spin svg { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="mark" aria-label="Jay's Feed"><b>Jay<i>.</i></b><span>Feed</span></div>
    <div class="topright"><span class="pill" id="n-feed"></span><button type="button" class="round" id="refresh" aria-label="Refresh"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button></div>
  </div>
  <main class="feed" id="feed" aria-live="polite"><div class="empty"><h2>Your feed is waking up.</h2><p>Fetching your cards from your team.</p></div></main>
  <nav role="tablist" aria-label="Views">
    <button type="button" role="tab" id="tab-feed" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l2.2 5.6L20 9.5l-4.5 3.8L17 19l-5-3.1L7 19l1.5-5.7L4 9.5l5.8-.9z"/></svg>For you</button>
    <button type="button" role="tab" id="tab-done" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Answered<span class="badge" id="b-done"></span></button>
    <button type="button" role="tab" id="tab-tell" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M5 18l-1 3 4-2h9a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v9"/></svg>Tell us</button>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true"></section>

<script>
(function () {
  var feed = document.getElementById("feed"), sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
  var cards = [], notes = [], view = "feed", query = "", api = "", key = "", lastError = "", sheetFor = null, sheetMode = "";
  var AUTH = { Navigator: ["var(--glow)", "N"], Operator: ["var(--glacier)", "O"], Builder: ["var(--gold)", "B"], Oogway: ["var(--leaf)", "O"], Shifu: ["var(--glow)", "S"], "Your team": ["var(--ink)", "T"] };
  var STYLES = { dawn: ["#1d2f4a", "#6b4f86", "#e0789a", "#f6c58f"], glacier: ["#08202a", "#145466", "#3fa3b6", "#bfe9f0"], gold: ["#1f1608", "#6b4310", "#d08a22", "#ffd98a"], forest: ["#07160f", "#16432c", "#3f8f5f", "#b9edc9"], night: ["#05080c", "#1a2340", "#3a3f7a", "#9aa6ff"], rose: ["#1c0c14", "#5c1f3c", "#c84a7a", "#ffc2d6"] };
  var QUIET = /^(ha|nice|let's go|sitting with it|love it|good|got it|watched it)$/i;
  var ICON = {
    heart: '<svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
    chat: '<svg class="i" viewBox="0 0 24 24"><path d="M5 18l-1 3 4-2h9a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v9"/></svg>',
    more: '<svg class="i" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
    close: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    send: '<svg class="i" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-7z"/></svg>',
    out: '<svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></svg>'
  };

  // ---- set-up: the first link carries #api=...&k=..., kept on this phone only ----
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  (function () {
    var h = location.hash.slice(1); if (!h) return;
    var p = new URLSearchParams(h);
    if (p.get("api") && p.get("k")) { ls("feed-api", p.get("api")); ls("feed-k", p.get("k")); history.replaceState(null, "", location.pathname); }
  })();
  api = ls("feed-api") || ""; key = ls("feed-k") || "";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>'); }
  function plain(s) { return String(s == null ? "" : s).replace(/\*\*(.+?)\*\*/g, "$1").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1"); }
  function hi(s) { var t = fmt(s); if (!query) return t; var q = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); return t.replace(new RegExp("(" + q + ")(?![^<]*>)", "gi"), "<mark>$1</mark>"); }
  function when(iso) { if (!iso) return ""; var d = new Date(iso); if (isNaN(d)) return ""; var today = new Date().toDateString() === d.toDateString(); return (today ? "" : d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) + " ") + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); }
  function safeUrl(u) { return /^https:\/\//i.test(String(u || "")) ? String(u) : ""; }

  function art(card, i) {
    var p = STYLES[card.style] || STYLES.dawn, k = card.kind || "", seed = 0;
    for (var j = 0; j < (card.id || "").length; j++) seed = (seed * 31 + card.id.charCodeAt(j)) % 997;
    var m;
    if (/learn|think/i.test(k)) m = '<circle cx="' + (60 + seed % 30) + '%" cy="24%" r="90" fill="' + p[3] + '" opacity="0.85"/><circle cx="' + (60 + seed % 30) + '%" cy="24%" r="150" fill="' + p[3] + '" opacity="0.12"/>';
    else if (/send|people|hello/i.test(k)) m = '<rect x="12%" y="12%" width="62%" height="14%" rx="22" fill="' + p[3] + '" opacity="0.9"/><rect x="30%" y="29%" width="56%" height="11%" rx="22" fill="' + p[2] + '" opacity="0.85"/>';

      document.querySelectorAll("nav button").forEach(function (x) { x.setAttribute("aria-selected", x.id === "tab-" + v ? "true" : "false"); });
      render(); feed.scrollTop = 0;
    });
  });
  refreshBtn.addEventListener("click", function () { load(false); });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") load(true); });
  setInterval(function () { if (document.visibilityState === "visible") load(true); }, 60000);
  setInterval(function () { if (sheetFor && sheetMode === "chat" && document.visibilityState === "visible") load(true); }, 20000);

  // ---- install: offered once, on the Tell us page, and never once the app is on the home screen ----
  var deferred = null;
  function installed() { return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true || ls("feed-installed") === "1"; }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); if (!installed()) deferred = e; });
  window.addEventListener("appinstalled", function () { ls("feed-installed", "1"); deferred = null; if (view === "tell") renderTell(); });
  if (installed()) ls("feed-installed", "1");
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});

  try { var cached = JSON.parse(ls("feed-cache") || "null"); if (cached) { cards = cached.cards || []; notes = cached.notes || []; } } catch (e) {}
  render();
  load(false);
})();
</script>

<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1022">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jay's Feed</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="app.css?v=8">
</head>
<body>
<div class="app on-home">
  <canvas id="sky" aria-hidden="true"></canvas>
  <main class="feed" id="feed" aria-live="polite"></main>
  <div class="toast" id="toast" role="status"></div>
  <nav role="tablist" aria-label="Views">
    <button type="button" role="tab" id="tab-home" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Home</button>
    <button type="button" role="tab" id="tab-feed" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="3"/></svg>For you<span class="dot" id="d-feed" hidden></span></button>
    <button type="button" role="tab" id="tab-tell" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Tell us</button>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true"></section>
<script src="sky.js?v=7"></script>
<script src="app.js?v=8"></script>
</body>
</html>

<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jay's Feed</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* One idea per screen, scroll like any short-form app. Night screen with first-light colours. */
:root {
  color-scheme: dark;
  --night: #0a1117; --panel: #121d25; --ink: #eef3f6; --soft: #a9bac5; --line: #ffffff1f;
  --glow: #f08aa8; --glacier: #6cc3d4; --gold: #f1b34a; --leaf: #7fd3a0;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; max-width: 480px; margin: 0 auto; }
header { padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.brand span { color: var(--glow); }
.iconbtn { font: inherit; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--soft); cursor: pointer; }
.tabs { display: flex; gap: 6px; }
.tabs button { font: inherit; font-size: 0.82rem; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--soft); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--night); border-color: var(--ink); }
.count { font-family: var(--mono); font-size: 0.7rem; margin-left: 4px; }
.feed { overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
.feed::-webkit-scrollbar { display: none; }
.feed.list { scroll-snap-type: none; }

.card { position: relative; min-height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: grid; align-content: end; overflow: hidden; border-bottom: 1px solid var(--line); }
.art { position: absolute; inset: 0; }
.art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, #0a111700 0%, #0a111733 35%, #0a1117d9 72%, #0a1117 100%); }
.content { position: relative; z-index: 2; padding-top: 24px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 64px; display: grid; gap: 10px; min-width: 0; }
.who { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); }
.dot { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 0.75rem; color: var(--night); }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(3.2rem, 18vw, 5.4rem); line-height: 0.95; letter-spacing: -0.03em; }
.title { font-family: var(--display); font-weight: 800; font-size: 1.55rem; line-height: 1.12; text-wrap: balance; margin: 0; }
.body { color: #e3ebf0; white-space: pre-line; }
a { color: var(--glacier); }
.more { background: #0a1117cc; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 0.95rem; white-space: pre-line; max-height: 38vh; overflow-y: auto; }
.teamreply { background: #6cc3d424; border: 1px solid #6cc3d466; border-radius: 14px; padding: 10px 12px; font-size: 0.93rem; white-space: pre-line; }
.teamreply b { color: var(--glacier); font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; display: block; margin-bottom: 2px; }
.copybox { background: #ffffff12; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.copybox .txt { white-space: pre-line; font-size: 0.95rem; user-select: text; -webkit-user-select: text; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: inherit; font-size: 0.9rem; padding: 9px 14px; border-radius: 999px; border: 1px solid #ffffff38; background: #ffffff14; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--ink); color: var(--night); border-color: var(--ink); font-weight: 700; }
.btn[aria-pressed="true"] { background: var(--glacier); color: var(--night); border-color: var(--glacier); font-weight: 700; }
button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.reply { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
textarea, input[type="search"] { font: inherit; font-size: 0.95rem; width: 100%; border-radius: 14px; border: 1px solid #ffffff38; background: #0a1117b3; color: var(--ink); padding: 9px 12px; }
.reply textarea { min-height: 42px; max-height: 120px; resize: vertical; }
.status { font-family: var(--mono); font-size: 0.72rem; color: var(--leaf); min-height: 1em; }
.status.warn { color: var(--gold); }
.rail { position: absolute; z-index: 3; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); display: grid; gap: 14px; justify-items: center; }
.rail button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid #ffffff38; background: #0a111799; color: var(--ink); font-size: 1.25rem; cursor: pointer; display: grid; place-items: center; }
.rail button[aria-pressed="true"] { background: var(--glow); border-color: var(--glow); color: var(--night); }
.rail small { font-family: var(--mono); font-size: 0.62rem; color: var(--soft); margin-top: -10px; }
.pos { font-family: var(--mono); font-size: 0.7rem; color: var(--soft); }

.empty, .tell { min-height: 100%; scroll-snap-align: start; display: grid; align-content: center; gap: 14px; padding: 40px max(20px, env(safe-area-inset-right, 0px)) 40px max(20px, env(safe-area-inset-left, 0px)); }
.empty h2, .tell h2 { font-family: var(--display); font-weight: 800; font-size: 1.8rem; margin: 0; text-wrap: balance; }
.empty p, .tell p { color: var(--soft); margin: 0; }
.tell textarea { min-height: 140px; background: var(--panel); }
.sent { display: grid; gap: 8px; }
.sent div { background: var(--panel); border-radius: 12px; padding: 10px 12px; font-size: 0.9rem; color: var(--soft); }

.listwrap { padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 30px) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.item summary { cursor: pointer; list-style: none; display: grid; gap: 4px; }
.item summary::-webkit-details-marker { display: none; }
.item .t { font-family: var(--display); font-weight: 700; font-size: 1.02rem; }
.item .meta { font-family: var(--mono); font-size: 0.68rem; color: var(--soft); display: flex; gap: 10px; flex-wrap: wrap; }
.item .ans { color: var(--glacier); }
.item .in { display: grid; gap: 8px; margin-top: 8px; font-size: 0.93rem; white-space: pre-line; }
mark { background: var(--gold); color: var(--night); border-radius: 3px; padding: 0 2px; }
.setup { padding: 40px 22px; display: grid; gap: 14px; }
.setup h2 { font-family: var(--display); font-weight: 800; font-size: 1.8rem; margin: 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Jay<span>.</span>feed <button type="button" class="iconbtn" id="refresh" aria-label="Refresh">↻</button><button type="button" class="btn" id="install" hidden>Install</button></div>
    <div class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" id="tab-feed" aria-selected="true">For you<span class="count" id="n-feed"></span></button>
      <button type="button" role="tab" id="tab-done" aria-selected="false">Answered</button>
      <button type="button" role="tab" id="tab-tell" aria-selected="false">Tell us</button>
    </div>
  </header>
  <main class="feed" id="feed" aria-live="polite">
    <div class="empty"><h2>Your feed is waking up.</h2><p>Fetching your cards from your team.</p></div>
  </main>
</div>

<script>
(function () {
  var feed = document.getElementById("feed");
  var cards = [], notes = [], view = "feed", query = "", api = "", key = "", lastError = "";
  var AUTH = { Navigator: ["var(--glow)", "N"], Operator: ["var(--glacier)", "O"], Builder: ["var(--gold)", "B"], Oogway: ["var(--leaf)", "O"], Shifu: ["var(--glow)", "S"], "Your team": ["var(--ink)", "T"] };
  var STYLES = { dawn: ["#1d2f4a", "#6b4f86", "#e0789a", "#f6c58f"], glacier: ["#08202a", "#145466", "#3fa3b6", "#bfe9f0"], gold: ["#1f1608", "#6b4310", "#d08a22", "#ffd98a"], forest: ["#07160f", "#16432c", "#3f8f5f", "#b9edc9"], night: ["#05080c", "#1a2340", "#3a3f7a", "#9aa6ff"], rose: ["#1c0c14", "#5c1f3c", "#c84a7a", "#ffc2d6"] };
  var QUIET = /^(ha|nice|let's go|sitting with it|love it|good|got it|watched it)$/i;

  // ---- set-up: the first link carries #api=...&k=..., kept on this phone only ----
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  (function () {
    var h = location.hash.slice(1); if (!h) return;
    var p = new URLSearchParams(h);
    if (p.get("api") && p.get("k")) { ls("feed-api", p.get("api")); ls("feed-k", p.get("k")); history.replaceState(null, "", location.pathname); }
  })();
  api = ls("feed-api") || ""; key = ls("feed-k") || "";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>'); }
  function hi(s) { var t = fmt(s); if (!query) return t; var q = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); return t.replace(new RegExp("(" + q + ")(?![^<]*>)", "gi"), "<mark>$1</mark>"); }
  function when(iso) { if (!iso) return ""; var d = new Date(iso); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); }

  function art(card, i) {
    var p = STYLES[card.style] || STYLES.dawn, k = card.kind || "", seed = 0;
    for (var j = 0; j < (card.id || "").length; j++) seed = (seed * 31 + card.id.charCodeAt(j)) % 997;
    var m;
    if (/learn|think/i.test(k)) m = '<circle cx="' + (60 + seed % 30) + '%" cy="28%" r="90" fill="' + p[3] + '" opacity="0.85"/><circle cx="' + (60 + seed % 30) + '%" cy="28%" r="150" fill="' + p[3] + '" opacity="0.12"/>';
    else if (/send|people/i.test(k)) m = '<rect x="12%" y="14%" width="62%" height="16%" rx="22" fill="' + p[3] + '" opacity="0.9"/><rect x="30%" y="34%" width="56%" height="13%" rx="22" fill="' + p[2] + '" opacity="0.85"/>';
    else if (/build|money/i.test(k)) m = '<g opacity="0.55">' + [0, 1, 2, 3, 4, 5].map(function (n) { return '<rect x="' + (14 + n * 12) + '%" y="' + (40 - n * 5 - (seed + n * 7) % 6) + '%" width="8%" height="' + (8 + n * 5 + (seed + n * 7) % 6) + '%" rx="6" fill="' + p[3] + '"/>'; }).join("") + '</g>';
    else if (/win|gift/i.test(k)) m = [0, 1, 2, 3, 4, 5, 6, 7].map(function (n) { var a = (n / 8) * Math.PI * 2; return '<line x1="50%" y1="30%" x2="' + (50 + Math.cos(a) * 34) + '%" y2="' + (30 + Math.sin(a) * 22) + '%" stroke="' + p[3] + '" stroke-width="10" stroke-linecap="round" opacity="0.7"/>'; }).join("") + '<circle cx="50%" cy="30%" r="46" fill="' + p[3] + '"/>';
    else m = '<circle cx="' + (30 + seed % 40) + '%" cy="36%" r="70" fill="' + p[3] + '" opacity="0.9"/><path d="M0 380 L120 250 L210 320 L320 200 L430 300 L520 230 L640 330 L640 900 L0 900 Z" fill="' + p[1] + '" opacity="0.9"/><path d="M0 430 L150 330 L260 400 L380 300 L500 390 L640 320 L640 900 L0 900 Z" fill="' + p[0] + '"/>';
    return '<svg viewBox="0 0 640 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g' + i + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + p[0] + '"/><stop offset="0.55" stop-color="' + p[1] + '"/><stop offset="1" stop-color="' + p[2] + '"/></linearGradient></defs><rect width="640" height="900" fill="url(#g' + i + ')"/>' + m + '</svg>';
  }

  function live(c) { return !(c.expires && Date.parse(c.expires) < Date.now()); }
  function answered(c) { return Boolean(c.answer && c.answer.choice); }
  function open() { return cards.filter(function (c) { return live(c) && !answered(c); }).sort(function (a, b) { return (b.order || 0) - (a.order || 0) || String(b.created || "").localeCompare(String(a.created || "")); }); }

  function render() {
    document.getElementById("n-feed").textContent = api ? " " + open().length : "";
    feed.classList.toggle("list", view !== "feed");
    if (!api || !key) { feed.innerHTML = '<div class="setup"><h2>Open your setup link once.</h2><p>Your team sent a link that starts this app with your key - open it on this phone, then tap Install. The key stays on this phone.</p></div>'; return; }
    if (view === "tell") return renderTell();
    if (view === "done") return renderDone();
    var list = open();
    if (!list.length) { feed.innerHTML = '<div class="empty"><h2>' + (lastError ? "Can't reach your team right now." : "All caught up. ✨") + '</h2><p>' + (lastError ? esc(lastError) : "Nothing waiting. Go and do something you love. New cards land after the Morning and the Evening, and whenever the team finishes something.") + '</p></div>'; return; }
    feed.innerHTML = list.map(function (c, i) {
      var a = c.answer || {}, au = AUTH[c.author] || AUTH["Your team"];
      var acts = (c.actions || []).map(function (x, j) {
        if (x.url) return '<a class="btn' + (j === 0 ? " primary" : "") + '" href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.label) + ' ↗</a>';
        return '<button type="button" class="btn' + (j === 0 ? " primary" : "") + '" data-act="answer" data-id="' + esc(c.id) + '" data-answer="' + esc(x.answer || x.label) + '" data-quiet="' + (x.quiet ? "1" : "") + '">' + esc(x.label) + '</button>';
      }).join("");
      return '<article class="card" id="c-' + esc(c.id) + '">' +
        '<div class="art">' + art(c, i) + '</div><div class="shade"></div>' +
        '<div class="rail"><button type="button" data-act="love" data-id="' + esc(c.id) + '" aria-pressed="' + Boolean(a.loved) + '" aria-label="Love this">♥</button><small>love</small>' +
        (c.more ? '<button type="button" data-act="more" data-id="' + esc(c.id) + '" aria-label="Dive in">⤢</button><small>dive in</small>' : '') +
        '<button type="button" data-act="focus" data-id="' + esc(c.id) + '" aria-label="Reply">✎</button><small>reply</small></div>' +
        '<div class="content">' +
          '<div class="who"><span class="dot" style="background:' + au[0] + '">' + au[1] + '</span>' + esc(c.author || "Your team") + (c.kind ? ' · ' + esc(c.kind) : '') + '</div>' +
          (c.big ? '<div class="big">' + esc(c.big) + '</div>' : '') +
          '<h2 class="title">' + esc(c.title) + '</h2>' +
          (c.body ? '<div class="body">' + fmt(c.body) + '</div>' : '') +
          (c.more ? '<div class="more" id="m-' + esc(c.id) + '" hidden>' + fmt(c.more) + '</div>' : '') +
          (c.teamReply ? '<div class="teamreply"><b>Your team</b>' + fmt(c.teamReply) + '</div>' : '') +
          (c.copy ? '<div class="copybox"><div class="txt" id="t-' + esc(c.id) + '">' + esc(c.copy) + '</div><div class="row"><button type="button" class="btn" data-act="copy" data-id="' + esc(c.id) + '">Copy message</button></div></div>' : '') +
          (acts ? '<div class="row">' + acts + '</div>' : '') +
          '<div class="reply"><textarea id="r-' + esc(c.id) + '" rows="1" placeholder="Reply to the team…" aria-label="Reply to the team">' + esc(a.text || "") + '</textarea><button type="button" class="btn" data-act="reply" data-id="' + esc(c.id) + '">Send</button></div>' +
          '<div class="row" style="justify-content:space-between"><span class="status" id="s-' + esc(c.id) + '">' + (a.text ? "✓ Reply sent" : "") + '</span><span class="pos">' + (i + 1) + ' / ' + list.length + '</span></div>' +
        '</div></article>';
    }).join("") + '<div class="empty"><h2>That\'s everything for now.</h2><p>Swipe back up, or use Tell us to send the team anything on your mind.</p></div>';
  }

  function renderDone() {
    var q = query.toLowerCase();
    var list = cards.filter(function (c) { return answered(c) || !live(c) || (q && true); }).filter(function (c) {
      if (!q) return answered(c) || !live(c);
      var a = c.answer || {};
      return [c.title, c.body, c.more, c.copy, c.teamReply, c.kind, c.author, a.choice, a.text].join(" ").toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return String((b.answer || {}).at || b.created || "").localeCompare(String((a.answer || {}).at || a.created || "")); });
    feed.innerHTML = '<div class="listwrap"><input type="search" id="search" placeholder="Search everything - titles, messages, your replies" aria-label="Search the feed" value="' + esc(query) + '">' +
      (list.length ? list.map(function (c) {
        var a = c.answer || {};
        return '<details class="item"><summary><span class="t">' + hi(c.title) + '</span><span class="meta"><span>' + esc(c.kind || "") + '</span>' +
          (a.choice ? '<span class="ans">✓ ' + hi(a.choice) + '</span>' : (live(c) ? '<span>open</span>' : '<span>retired</span>')) +
          '<span>' + when(a.at || c.created) + '</span>' + (a.loved ? '<span>♥</span>' : '') + '</span></summary>' +
          '<div class="in">' + (c.body ? '<div>' + hi(c.body) + '</div>' : '') + (c.copy ? '<div class="copybox"><div class="txt">' + hi(c.copy) + '</div></div>' : '') +
          (a.text ? '<div class="teamreply"><b>You</b>' + hi(a.text) + '</div>' : '') + (c.teamReply ? '<div class="teamreply"><b>Your team</b>' + hi(c.teamReply) + '</div>' : '') +
          ((c.actions || []).filter(function (x) { return x.url; }).map(function (x) { return '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.label) + ' ↗</a>'; }).join(" ")) + '</div></details>';
      }).join("") : '<div class="empty" style="min-height:auto"><p>' + (query ? "Nothing matches that yet." : "Cards you answer move here, so you can find them again.") + '</p></div>') + '</div>';
    var s = document.getElementById("search");
    s.addEventListener("input", function () { query = s.value.trim(); var pos = s.selectionStart; renderDone(); var n = document.getElementById("search"); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} });
  }

  function renderTell() {
    feed.innerHTML = '<div class="tell"><h2>Tell the team anything.</h2><p>An idea, a feeling, a change of plan. Start with "idea:" and it gets filed with a date to come back to.</p>' +
      '<textarea id="tell-text" placeholder="What\'s on your mind?" aria-label="Message to the team"></textarea>' +
      '<div class="row"><button type="button" class="btn primary" data-act="tell">Send to the team</button></div><span class="status" id="tell-status"></span>' +
      '<div class="sent">' + notes.slice(0, 6).map(function (n) { return '<div>' + esc(n.text) + '</div>'; }).join("") + '</div></div>';
  }

  // ---- talking to the Switchboard ----
  function load(quiet) {
    if (!api || !key) { render(); return; }
    fetch(api + (api.indexOf("?") === -1 ? "?" : "&") + "api=feed&k=" + encodeURIComponent(key), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error(d.error === "key" ? "Your key was not recognised - open your setup link again." : "The Switchboard said: " + d.error);
        lastError = ""; cards = d.cards || []; notes = d.notes || [];
        ls("feed-cache", JSON.stringify({ cards: cards, notes: notes }));
        if (!quiet || !document.activeElement || document.activeElement.tagName !== "TEXTAREA") { var top = feed.scrollTop; if (view !== "done") { render(); feed.scrollTop = top; } else if (!query) renderDone(); }
      })
      .catch(function (e) { lastError = e.message || "No connection - showing what was here last."; if (!cards.length) render(); });
  }
  function post(body) {
    body.api = "feed"; body.k = key;
    return fetch(api, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).then(function (d) { if (!d.ok) throw new Error(d.error || "failed"); return d; });
  }
  function status(id, t, warn) { var s = document.getElementById("s-" + id); if (s) { s.textContent = t; s.className = "status" + (warn ? " warn" : ""); } }
  function card(id) { return cards.filter(function (c) { return c.id === id; })[0]; }

  feed.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var id = b.dataset.id, act = b.dataset.act, c = card(id);
    if (act === "answer") {
      var ans = b.dataset.answer, quiet = b.dataset.quiet === "1" || QUIET.test(ans);
      status(id, "Saving…");
      post({ op: "answer", id: id, choice: ans, quiet: quiet }).then(function (d) {
        if (c) c.answer = d.answer;
        status(id, "✓ " + ans + (quiet ? "" : " - the team is on it"));
        setTimeout(function () { var el = document.getElementById("c-" + id); var nx = el && el.nextElementSibling; render(); if (nx && nx.id) { var t = document.getElementById(nx.id); if (t) t.scrollIntoView(); } }, 900);
      }).catch(function () { status(id, "Couldn't save - check your signal and tap again", true); });
    } else if (act === "love") {
      var on = !((c && c.answer) || {}).loved; b.setAttribute("aria-pressed", String(on));
      post({ op: "answer", id: id, loved: on, quiet: true }).then(function (d) { if (c) c.answer = d.answer; status(id, on ? "♥ Loved - more like this" : ""); }).catch(function () { status(id, "Couldn't save", true); });
    } else if (act === "more") { var m = document.getElementById("m-" + id); if (m) m.hidden = !m.hidden; }
    else if (act === "focus") { var t = document.getElementById("r-" + id); if (t) t.focus(); }
    else if (act === "reply") {
      var ta = document.getElementById("r-" + id), v = ta ? ta.value.trim() : "";
      if (!v) { if (ta) ta.focus(); return; }
      status(id, "Sending…");
      post({ op: "answer", id: id, text: v }).then(function (d) { if (c) c.answer = d.answer; status(id, "✓ Reply sent - the team is on it"); }).catch(function () { status(id, "Couldn't send - tap again", true); });
    } else if (act === "copy") {
      var txt = (document.getElementById("t-" + id) || {}).textContent || "";
      try { navigator.clipboard.writeText(txt).then(function () { status(id, "Copied - paste it into WhatsApp"); }).catch(function () { status(id, "Long-press the message to copy it", true); }); }
      catch (err) { status(id, "Long-press the message to copy it", true); }
    } else if (act === "tell") {
      var tt = document.getElementById("tell-text"), val = tt ? tt.value.trim() : "", ts = document.getElementById("tell-status");
      if (!val) { if (tt) tt.focus(); return; }
      ts.textContent = "Sending…";
      post({ op: "note", text: val }).then(function () { ts.textContent = "✓ Sent - the team is on it"; notes.unshift({ text: val }); tt.value = ""; })
        .catch(function () { ts.textContent = "Couldn't send - tap again, or use Telegram"; });
    }
  });

  ["feed", "done", "tell"].forEach(function (v) {
    document.getElementById("tab-" + v).addEventListener("click", function () {
      view = v;
      document.querySelectorAll(".tabs button").forEach(function (x) { x.setAttribute("aria-selected", x.id === "tab-" + v ? "true" : "false"); });
      render(); feed.scrollTop = 0;
    });
  });
  document.getElementById("refresh").addEventListener("click", function () { load(false); });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") load(true); });
  setInterval(function () { if (document.visibilityState === "visible") load(true); }, 90000);

  // ---- install ----
  var deferred = null, installBtn = document.getElementById("install");
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; installBtn.hidden = false; });
  installBtn.addEventListener("click", function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; installBtn.hidden = true; }); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});

  try { var cached = JSON.parse(ls("feed-cache") || "null"); if (cached) { cards = cached.cards || []; notes = cached.notes || []; } } catch (e) {}
  render();
  load(false);
})();
</script>
</body>
</html>
